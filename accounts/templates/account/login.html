{% load allauth account %}
<!DOCTYPE html>
<html lang="fr" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Job Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full">
<div class="flex min-h-full flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h1 class="mt-6 text-center text-3xl font-bold tracking-tight text-gray-900">
      Job Tracker
    </h1>
    <p class="mt-2 text-center text-sm text-gray-600">Suivi de candidatures</p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white px-4 py-8 shadow sm:rounded-lg sm:px-10">
      <form method="post" action="{% url 'account_login' %}" class="space-y-6">
        {% csrf_token %}
        {% for field in form %}
        <div>
          <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700">
            {{ field.label }}
          </label>
          <div class="mt-1">
            {% if field.field.widget.input_type == "checkbox" %}
              {{ field }}
            {% else %}
              <input
                type="{{ field.field.widget.input_type }}"
                name="{{ field.html_name }}"
                id="{{ field.id_for_label }}"
                {% if field.value %}value="{{ field.value }}"{% endif %}
                class="block w-full appearance-none rounded-md border border-gray-300 px-3 py-2 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm"
                {% if field.field.required %}required{% endif %}
              />
            {% endif %}
          </div>
          {% if field.errors %}
          <p class="mt-1 text-sm text-red-600">{{ field.errors|join:", " }}</p>
          {% endif %}
        </div>
        {% endfor %}

        <div>
          <button
            type="submit"
            class="flex w-full justify-center rounded-md border border-transparent bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
          >
            Se connecter
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
