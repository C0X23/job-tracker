name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to IONOS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash <<EOF
            set -euo pipefail
            cd "$DEPLOY_PATH"
            COMPOSE="docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml"
            git fetch --all --prune
            git reset --hard origin/main
            \$COMPOSE pull db caddy || true
            \$COMPOSE build web
            \$COMPOSE up -d --remove-orphans
            # Caddy bind-mounts the Caddyfile but doesn't auto-reload; force it.
            \$COMPOSE exec -T caddy caddy reload --config /etc/caddy/Caddyfile || \$COMPOSE restart caddy
            docker image prune -f
          EOF

      - name: Smoke test
        env:
          URL: https://${{ secrets.DEPLOY_DOMAIN }}/accounts/login/
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Deploy smoke test failed"
          exit 1
