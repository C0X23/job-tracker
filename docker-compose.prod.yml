services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application
               --bind 0.0.0.0:8000
               --workers 2
               --access-logfile -
               --error-logfile -"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env.prod
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    env_file:
      - .env.prod
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
               TS=$$(date +%Y%m%d_%H%M%S);
               pg_dump -h db -U $$POSTGRES_USER $$POSTGRES_DB | gzip > /backups/jobtracker_$$TS.sql.gz;
               find /backups -name 'jobtracker_*.sql.gz' -mtime +14 -delete;
               sleep 86400;
             done"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
