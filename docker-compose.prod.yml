services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Override the dev environment block: prod values come from .env.prod
    # via compose interpolation. Run with `--env-file .env.prod`.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command:
      - sh
      - -c
      - python manage.py migrate && python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile -
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env.prod
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    env_file:
      - .env.prod
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          TS=$$(date +%Y%m%d_%H%M%S);
          pg_dump -h db -U "$$POSTGRES_USER" "$$POSTGRES_DB" | gzip > "/backups/jobtracker_$$TS.sql.gz";
          find /backups -name 'jobtracker_*.sql.gz' -mtime +14 -delete;
          sleep 86400;
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Public demo account is reset every 24h so visitors always see a populated app
  # and we contain the blast radius of any vandalism.
  demo-reset:
    image: job-tracker-web:latest
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    entrypoint:
      - sh
      - -c
      - |
        # Wait once on first boot so /static/ etc. are ready
        sleep 30
        while true; do
          python manage.py seed_demo || echo "seed_demo failed, will retry next cycle"
          sleep 86400
        done
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
