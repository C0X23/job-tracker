{% extends "base.html" %}

{% block title %}Statistiques — Job Tracker{% endblock %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<div class="space-y-10" x-data="statsPage()" x-init="load()">

  <header>
    <h1 class="text-[28px] font-semibold tracking-tight text-ink">Statistiques</h1>
    <p class="mt-1 text-sm text-ink-dim">Vue d'ensemble de votre recherche</p>
  </header>

  {# Summary cards #}
  <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <template x-for="card in summaryCards" :key="card.label">
      <div class="bg-paper border border-line rounded-md p-5">
        <p class="font-mono text-xs uppercase tracking-wider text-ink-mute" x-text="card.label"></p>
        <p class="mt-2 font-mono text-3xl tabular text-ink" x-text="card.value"></p>
      </div>
    </template>
  </section>

  {# Charts grid #}
  <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">

    <div class="bg-paper border border-line rounded-md p-5">
      <h2 class="font-mono text-xs uppercase tracking-wider text-ink-mute mb-4">Par statut</h2>
      <canvas id="chart-status" height="200"></canvas>
    </div>

    <div class="bg-paper border border-line rounded-md p-5">
      <h2 class="font-mono text-xs uppercase tracking-wider text-ink-mute mb-4">Par source</h2>
      <canvas id="chart-source" height="200"></canvas>
    </div>

    <div class="bg-paper border border-line rounded-md p-5 lg:col-span-2">
      <h2 class="font-mono text-xs uppercase tracking-wider text-ink-mute mb-4">Volume par semaine — 12 dernières</h2>
      <canvas id="chart-weekly" height="100"></canvas>
    </div>

    <div class="bg-paper border border-line rounded-md p-5 lg:col-span-2">
      <h2 class="font-mono text-xs uppercase tracking-wider text-ink-mute mb-4">Funnel de conversion</h2>
      <canvas id="chart-funnel" height="120"></canvas>
    </div>

  </section>
</div>

<script>
  function statsPage() {
    return {
      summaryCards: [],
      async load() {
        const [summary, status, source, weekly, funnel] = await Promise.all([
          fetch("/api/v1/stats/summary/").then(r => r.json()),
          fetch("/api/v1/stats/status/").then(r => r.json()),
          fetch("/api/v1/stats/source/").then(r => r.json()),
          fetch("/api/v1/stats/weekly/").then(r => r.json()),
          fetch("/api/v1/stats/funnel/").then(r => r.json()),
        ]);

        this.summaryCards = [
          { label: "Total", value: summary.total },
          { label: "Actives", value: summary.active },
          { label: "À relancer", value: summary.overdue },
          { label: "Cette semaine", value: summary.this_week },
        ];

        // Palette monochrome vert sapin — un seul accent décliné en saturations
        const palette = ["#14201A","#1F4D3A","#266338","#2f7a45","#3f9457","#5fad72","#8cc69a","#b9ddc1","#dceee0","#1F5030","#3f9457"];
        const accent = "#1F4D3A";
        const accentFill = "rgba(31, 77, 58, 0.15)";

        Chart.defaults.font.family = "'Inter Tight', 'Inter', system-ui, sans-serif";
        Chart.defaults.color = "#5A6660";
        Chart.defaults.borderColor = "#E8E5DC";

        new Chart(document.getElementById("chart-status"), {
          type: "doughnut",
          data: {
            labels: status.filter(s => s.count > 0).map(s => s.label),
            datasets: [{
              data: status.filter(s => s.count > 0).map(s => s.count),
              backgroundColor: palette,
              borderColor: "#fff",
              borderWidth: 2,
            }],
          },
          options: { plugins: { legend: { position: "right", labels: { boxWidth: 12, font: { size: 11 } } } } },
        });

        new Chart(document.getElementById("chart-source"), {
          type: "bar",
          data: {
            labels: source.map(s => s.label),
            datasets: [{ label: "Candidatures", data: source.map(s => s.count), backgroundColor: accent }],
          },
          options: { indexAxis: "y", plugins: { legend: { display: false } }, scales: { x: { ticks: { precision: 0 } } } },
        });

        new Chart(document.getElementById("chart-weekly"), {
          type: "line",
          data: {
            labels: weekly.map(w => {
              const d = new Date(w.week_start);
              return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" });
            }),
            datasets: [{
              label: "Candidatures",
              data: weekly.map(w => w.count),
              borderColor: accent,
              backgroundColor: accentFill,
              fill: true,
              tension: 0.3,
            }],
          },
          options: { plugins: { legend: { display: false } }, scales: { y: { ticks: { precision: 0 } } } },
        });

        new Chart(document.getElementById("chart-funnel"), {
          type: "bar",
          data: {
            labels: funnel.map(f => f.label),
            datasets: [{
              label: "Candidatures",
              data: funnel.map(f => f.count),
              backgroundColor: ["#1a4128","#266338","#3f9457","#5fad72"],
            }],
          },
          options: { plugins: { legend: { display: false } }, scales: { y: { ticks: { precision: 0 } } } },
        });
      },
    };
  }
</script>
{% endblock %}
