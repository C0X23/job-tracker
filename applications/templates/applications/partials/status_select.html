{% load application_tags %}
<form id="status-widget"
      hx-post="{% url 'application_status_update' application.pk %}"
      hx-target="#status-widget"
      hx-swap="outerHTML"
      class="flex items-center gap-2">
  {% csrf_token %}
  <select name="status"
          class="bg-transparent border-0 border-b border-line px-0 py-1 text-sm text-ink focus:border-accent focus:ring-0 outline-none">
    {% for value, label in status_choices %}
    <option value="{{ value }}" {% if value == application.status %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
  <button type="submit"
          class="bg-accent hover:bg-accent-hover text-white px-3 py-1 rounded-md text-xs transition-colors">
    OK
  </button>
  <button type="button"
          hx-get="{% url 'application_status_update' application.pk %}"
          hx-target="#status-widget"
          hx-swap="outerHTML"
          class="font-mono text-xs uppercase tracking-wider text-ink-mute hover:text-ink">
    Annuler
  </button>
</form>
