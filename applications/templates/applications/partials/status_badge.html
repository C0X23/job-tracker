{% load application_tags %}
<div id="status-widget" class="flex items-center gap-3">
  <span class="inline-flex items-center px-2 py-0.5 rounded-sm text-xs font-medium tracking-wide {{ status_color }}">
    {{ application.get_status_display }}
  </span>
  <button
    hx-get="{% url 'application_status_update' application.pk %}"
    hx-target="#status-widget"
    hx-swap="outerHTML"
    class="font-mono text-xs uppercase tracking-wider text-ink-mute hover:text-ink">
    Changer
  </button>
</div>
