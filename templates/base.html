<!DOCTYPE html>
<html lang="fr" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Job Tracker{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.2"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    .markdown h1 { font-size: 1.25rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #111827; }
    .markdown h2 { font-size: 1.125rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #111827; }
    .markdown h3 { font-size: 1rem; font-weight: 600; margin-top: 0.75rem; margin-bottom: 0.5rem; color: #111827; }
    .markdown p { margin: 0.5rem 0; }
    .markdown ul { list-style: disc; padding-left: 1.5rem; margin: 0.5rem 0; }
    .markdown ol { list-style: decimal; padding-left: 1.5rem; margin: 0.5rem 0; }
    .markdown li { margin: 0.25rem 0; }
    .markdown a { color: #4f46e5; text-decoration: underline; }
    .markdown code { background: #f3f4f6; padding: 0.125rem 0.25rem; border-radius: 0.25rem; font-size: 0.85em; }
    .markdown pre { background: #f3f4f6; padding: 0.75rem; border-radius: 0.375rem; overflow-x: auto; margin: 0.5rem 0; }
    .markdown pre code { background: transparent; padding: 0; }
    .markdown blockquote { border-left: 3px solid #d1d5db; padding-left: 0.75rem; color: #6b7280; margin: 0.5rem 0; }
    .markdown strong { font-weight: 600; }
    .markdown em { font-style: italic; }
    .markdown table { border-collapse: collapse; margin: 0.5rem 0; }
    .markdown th, .markdown td { border: 1px solid #e5e7eb; padding: 0.25rem 0.5rem; }
  </style>
</head>
<body class="h-full">

<div class="min-h-full">
  <nav class="bg-indigo-700">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between">
        <div class="flex items-center gap-8">
          <a href="/" class="text-white font-bold text-lg tracking-tight">Job Tracker</a>
          {% if user.is_authenticated %}
          <div class="flex gap-4">
            <a href="/" class="text-indigo-100 hover:text-white text-sm font-medium">Dashboard</a>
            <a href="/applications/" class="text-indigo-100 hover:text-white text-sm font-medium">Candidatures</a>
            <a href="/stats/" class="text-indigo-100 hover:text-white text-sm font-medium">Stats</a>
          </div>
          {% endif %}
        </div>
        {% if user.is_authenticated %}
        <div class="flex items-center gap-4">
          <span class="text-indigo-200 text-sm">{{ user.email }}</span>
          <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button type="submit" class="text-indigo-100 hover:text-white text-sm font-medium">
              Déconnexion
            </button>
          </form>
        </div>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
    {% if messages %}
    <div class="mb-6 space-y-2">
      {% for message in messages %}
      <div class="rounded-md px-4 py-3 text-sm
        {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200
        {% elif message.tags == 'success' %}bg-green-50 text-green-700 border border-green-200
        {% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</div>

</body>
</html>
