[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-tracker"
version = "0.1.0"
description = "Personal job application tracking tool"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<7",
    "djangorestframework>=3.15",
    "django-allauth[mfa]>=65.0",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "Pillow>=10.4",
    "markdown2>=2.5",
    "whitenoise>=6.7",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "coverage>=7.6",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["applications*", "accounts*", "stats*", "config*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "N806"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "factory.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["."]
addopts = "--strict-markers -q"
markers = [
    "slow: mark test as slow",
]

[tool.coverage.run]
source = ["applications", "accounts", "stats"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
